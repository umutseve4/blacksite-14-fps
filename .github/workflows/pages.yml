name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # enablement: true was tried and the default GITHUB_TOKEN is refused
      # ("Resource not accessible by integration"), so Pages has to be switched
      # on once by hand: Settings > Pages > Source > GitHub Actions.
      - uses: actions/configure-pages@v5
      - name: refuse to publish a broken build
        run: node --experimental-vm-modules scripts/syntax-check.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
