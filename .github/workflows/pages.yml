name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # enablement: true cannot be used here: the default GITHUB_TOKEN is
      # refused with "Resource not accessible by integration". Pages was
      # therefore switched on by hand once, Settings > Pages > Source >
      # GitHub Actions, and this workflow has published every build since.
      - uses: actions/configure-pages@v5
      - name: refuse to publish a broken build
        run: node --experimental-vm-modules scripts/syntax-check.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
