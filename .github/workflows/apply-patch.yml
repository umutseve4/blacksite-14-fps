name: apply patch

# One-shot job. It runs a reviewed patch script that was verified locally
# against a pristine checkout, proves the result still parses and still passes
# the logic tests, then commits the result and removes the script. Both this
# file and the script are deleted immediately afterwards.

on:
  workflow_dispatch:
  repository_dispatch:
    types: [apply-patch]

permissions:
  contents: write

jobs:
  apply:
    name: apply the reviewed patch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: apply
        run: python3 tools/fix-dropped-trigger.py

      - name: the patched tree must still parse
        run: node --experimental-vm-modules scripts/syntax-check.mjs

      - name: the patched tree must still pass every logic test
        run: node --test tests/logic.test.mjs

      - name: the assertion counts must not have dropped
        shell: bash
        run: |
          set -euo pipefail
          logic=$(grep -c 'assert\.' tests/logic.test.mjs)
          smoke=$(grep -c '^  check(' tests/smoke.mjs)
          echo "logic assertions: $logic"
          echo "browser checks:   $smoke"
          test "$logic" -ge 114
          test "$smoke" -ge 20

      - name: remove the one-shot tooling
        run: |
          rm tools/fix-dropped-trigger.py
          rmdir tools || true

      - name: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit \
            -m 'fix: latch trigger presses, count draw calls over a whole frame' \
            -m 'A click that began and ended inside one long frame was dropped: the simulation read the button state at an instant instead of remembering the press. On the software rasteriser used in CI, where a frame can take seconds, the gun never fired, ammunition never dropped, and the reload had nothing to refill.' \
            -m 'Draw calls were also measured wrongly. renderer.info clears itself at the start of every render() call and the final post pass is one fullscreen quad, so a whole frame reported a single draw call. The loop now owns the reset.' \
            -m 'The browser test no longer sleeps for fixed windows. Every wait is now advance n frames up to a generous ceiling, which is progress, not frame rate.' \
            -m 'Assertions went from 103 to 114 and browser checks from 19 to 20. No check was weakened or removed.'
          git push
