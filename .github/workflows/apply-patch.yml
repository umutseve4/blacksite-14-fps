name: apply patch

on:
  workflow_dispatch:
  repository_dispatch:
    types: [apply-patch]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: apply the reviewed patch
        run: python3 tools/tighten-shadow-probe.py

      - name: every source file still parses
        run: node --experimental-vm-modules scripts/syntax-check.mjs

      - name: the simulation tests still pass
        run: node --test tests/logic.test.mjs

      - name: no assertion was lost
        shell: bash
        run: |
          set -euo pipefail
          logic=$(grep -c 'assert\.' tests/logic.test.mjs)
          smoke=$(grep -c '^  check(' tests/smoke.mjs)
          echo "logic assertions: $logic"
          echo "browser checks:   $smoke"
          test "$logic" -ge 131
          test "$smoke" -ge 26

      - name: drop the applier
        run: rm -rf tools

      - name: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: compare the shaded ground against itself, not against a distant patch' -m 'The first probe passed at a ratio of 0.8656, and that number deserved less trust than a green check implies. Its control was the mirror patch on the sun side, 72 m away, so the sand variation between two different pieces of ground was folded into the reading. It also picked a tower whose box centre sits 9.3 m up, throwing its shadow 36 m out, which says little about the ground a player walks on.' -m 'The control is now the same square metre with the caster hidden: same texels, same normals, same light, same camera, with occlusion by that one prop the only thing that changed. The mirror patch is kept as a second, independent reading, and the caster search now refuses any shadow landing more than 12 m away.' -m 'Browser checks went from 25 to 26. Nothing was weakened; the comparison the pass depends on got stricter.'
          git push
