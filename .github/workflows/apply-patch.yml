name: apply patch

on:
  workflow_dispatch:
  repository_dispatch:
    types: [apply-patch]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: apply the reviewed patch
        run: python3 tools/add-shadow-probe.py

      - name: every source file still parses
        run: node --experimental-vm-modules scripts/syntax-check.mjs

      - name: the simulation tests still pass
        run: node --test tests/logic.test.mjs

      - name: no assertion was lost
        shell: bash
        run: |
          set -euo pipefail
          logic=$(grep -c 'assert\.' tests/logic.test.mjs)
          smoke=$(grep -c '^  check(' tests/smoke.mjs)
          echo "logic assertions: $logic"
          echo "browser checks:   $smoke"
          test "$logic" -ge 131
          test "$smoke" -ge 25

      - name: drop the applier
        run: rm -rf tools

      - name: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: measure the shadow on the ground instead of trusting the flag' -m 'Every lighting check in this repository was a flag or a count: shadowMap enabled, castShadow set, a frustum sized, a map allocated. All of those can be true while the sand stays flat, and a screenshot from a real browser showed exactly that: a 14.5 degree sun and not one shadow on the ground.' -m 'Game.shadowProbe() renders two 32x32 top-down samples of the same ground, under the same sun, through the same material: the patch a chosen prop must shade, and the mirror patch the same distance on the sun side. Every other object is hidden for the duration, so occlusion by that one prop is the only difference between the samples. The light rig is dimmed by a uniform factor until the open sample comes off the clipping ceiling, because a clipped pair would read as no shadow even when the shadow is there.' -m 'Browser checks went from 20 to 25. No check was weakened or removed. If the shadows really are missing, this run goes red and says so.'
          git push
