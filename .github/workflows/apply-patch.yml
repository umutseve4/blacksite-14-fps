name: apply patch

on:
  workflow_dispatch:
  repository_dispatch:
    types: [apply-patch]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: apply the reviewed patch
        run: python3 tools/measure-sun-share.py

      - name: every source file still parses
        run: node --experimental-vm-modules scripts/syntax-check.mjs

      - name: the simulation tests still pass
        run: node --test tests/logic.test.mjs

      - name: no assertion was lost
        shell: bash
        run: |
          set -euo pipefail
          logic=$(grep -c 'assert\.' tests/logic.test.mjs)
          smoke=$(grep -c '^  check(' tests/smoke.mjs)
          echo "logic assertions: $logic"
          echo "browser checks:   $smoke"
          test "$logic" -ge 131
          test "$smoke" -ge 27

      - name: drop the applier
        run: rm -rf tools

      - name: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: measure how much of the light on the ground the sun is actually worth' -m 'Hiding a 6 m mast brightened the ground it shades by 6 percent, and that one number cannot tell a broken shadow map from a sun that never lit the sand in the first place.' -m 'The probe now takes a third sample at the same point, caster gone and sun at zero. That is the darkest a perfect shadow could make this patch, so the reported efficiency, (clear - occluded) / (clear - noSun), is the share of the sun contribution the shadow map really removes. Near 1 puts the fault in the light balance; near 0 puts it in the shadow map.' -m 'Browser checks went from 26 to 27. The failing check from the previous run was left exactly as it was.'
          git push
