name: apply patch

on:
  workflow_dispatch:
  repository_dispatch:
    types: [apply-patch]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: apply the reviewed patch
        run: python3 tools/harden-resume.py

      - name: every source file still parses
        run: node --experimental-vm-modules scripts/syntax-check.mjs

      - name: the simulation tests still pass
        run: node --test tests/logic.test.mjs

      - name: no assertion was lost
        shell: bash
        run: |
          set -euo pipefail
          logic=$(grep -c 'assert\.' tests/logic.test.mjs)
          smoke=$(grep -c '^  check(' tests/smoke.mjs)
          echo "logic assertions: $logic"
          echo "browser checks:   $smoke"
          test "$logic" -ge 117
          test "$smoke" -ge 20

      - name: drop the applier
        run: rm -rf tools

      - name: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: clear the trigger latch on resume, not only on pause' -m 'A review found a narrow window that pause() did not cover. exitPointerLock is not instantaneous, so a click arriving between the pause and the browser actually releasing the lock still passed the handler guard and latched a press. Nobody consumed it until the player resumed, and the game then fired a shot the player never aimed.' -m 'Both paths back into play now start from a cleared latch: the pointer lock resume branch and start(). A new unit test walks the exact sequence, so the window cannot reopen unnoticed.' -m 'Assertions went from 114 to 117. No check was weakened or removed.'
          git push
