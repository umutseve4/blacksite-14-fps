name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parse:
    name: every source file parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --experimental-vm-modules scripts/syntax-check.mjs

  logic:
    name: gameplay logic (45 tests, 131 assertions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: run the deterministic simulation tests
        run: node --test tests/logic.test.mjs

  browser:
    name: headless chromium smoke test (25 checks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: install playwright and a pinned three
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.47.2 three@0.169.0
          npx playwright install --with-deps chromium
      # Raw Actions logs cannot be read back through the API, so on failure the
      # tail of the run is republished as an annotation. The exit code is
      # captured first and re-raised last: no retry, no continue-on-error.
      - name: boot the game in a real browser
        shell: bash
        run: |
          set +e
          node tests/smoke.mjs 2>&1 | tee smoke.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            body=$(tail -n 60 smoke.log | sed 's/%/%25/g')
            body=${body//$'\n'/%0A}
            echo "::error title=smoke test failed::$body"
          fi
          exit $code
      # The shadow probe reports two numbers that decide whether the sun is
      # doing anything at all. Artifacts cannot be pulled back through the API,
      # so those lines are republished as a notice and read from the run.
      - name: publish the measured lines
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          lines=$(grep -E '^# (sun|shadow probe)' smoke.log || true)
          if [ -n "$lines" ]; then
            body=${lines//$'\n'/%0A}
            echo "::notice title=shadow measurement::$body"
          fi
      - name: upload the frame it rendered
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshot
          path: artifacts/
          if-no-files-found: warn

  honesty:
    name: assertions were not deleted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: count assertions
        shell: bash
        run: |
          set -euo pipefail
          logic=$(grep -c 'assert\.' tests/logic.test.mjs)
          smoke=$(grep -c '^  check(' tests/smoke.mjs || true)
          echo "logic assertions: $logic"
          echo "browser checks:   $smoke"
          # A green pipeline earned by deleting checks is not a green pipeline.
          test "$logic" -ge 131
          test "$smoke" -ge 25

  assets:
    name: the repository really is asset-free
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: refuse any committed media file
        shell: bash
        run: |
          set -euo pipefail
          found=$(git ls-files | grep -Ei '\.(png|jpe?g|gif|webp|bmp|tga|dds|ktx2?|hdr|exr|mp3|ogg|wav|flac|m4a|gltf|glb|fbx|obj|dae|mtl|ttf|otf|woff2?)$' || true)
          if [ -n "$found" ]; then
            echo "::error title=asset file committed::$found"
            exit 1
          fi
          echo "no image, audio, model or font file is tracked in this repository"
