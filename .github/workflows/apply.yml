name: apply patch

# Applies scripts/apply-once.mjs to the working tree and commits the result.
# It exists because some source files are too large to rewrite byte by byte
# through the contents API. It runs only when the applier itself is pushed,
# and both the applier and this workflow are deleted straight afterwards.

on:
  push:
    paths:
      - 'scripts/apply-once.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # No continue-on-error: if the anchors do not match exactly once, the
      # patch is stale and this job has to fail rather than write something
      # nobody described.
      - name: apply
        run: node scripts/apply-once.mjs
      - name: show what changed
        run: git --no-pager diff --stat
      - name: commit
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name  "Umut SEVER"
          git config user.email "2404005065@ogrenci.sbu.edu.tr"
          git commit -am "fix: the shadow probe only accepts a caster that fills its own box

A mast is a 0.12 m pole with 0.9 m cross-arms. Its bounding box is 0.9 m
across, so it passed the probe's width test, but the thing that actually
blocks the sun is the pole. Half of the 0.3 m sample window landed outside
the shadow, and the probe reported that the shadow removes 45.9% of the
sunlight when what it had really measured was a badly chosen occluder.

Box props fill their own bounding box, so they are now the only casters the
probe will accept. This tightens the measurement rather than the threshold:
no assertion was relaxed and no number in the suite was lowered."
          git push
