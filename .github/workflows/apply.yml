name: apply patch

# One-shot. Runs when this file is pushed, then gets deleted.

on:
  push:
    paths:
      - '.github/workflows/apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rewrite the source size claim
        shell: bash
        run: |
          set -euo pipefail
          hits=$(grep -c '4,236 lines of JavaScript' README.md || true)
          if [ "$hits" != "1" ]; then
            echo "::error::expected the old figure exactly once, found $hits"
            exit 1
          fi
          js=$(find src -name '*.js' -print0 | xargs -0 cat | wc -l)
          if [ "$js" != "4246" ]; then
            echo "::error::src is $js lines, not the 4246 this patch was written for"
            exit 1
          fi
          sed -i 's/4,236 lines of JavaScript/4,246 lines of JavaScript/' README.md
          grep -n 'lines of JavaScript' README.md
      - name: commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          cat > /tmp/msg.txt <<'MSG'
          docs: the game is 4,246 lines of JavaScript after the shadow fix

          The shadow probe fix added six lines to src/main.js and four to
          src/render/world.js. The honesty job recounts the source and greps
          the README for the figure, so it caught the drift on the very next
          commit and turned the build red. That is the check working, not the
          check misfiring.
          MSG
          git config user.name  "Umut SEVER"
          git config user.email "2404005065@ogrenci.sbu.edu.tr"
          git commit -a -F /tmp/msg.txt
          git push
